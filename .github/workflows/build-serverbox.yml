name: Build ServerBox Linux ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout ServerBox repository
        uses: actions/checkout@v4
        with:
          repository: LollipopKit/flutter_server_box
          ref: main
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      # ---------- 安装 Flutter（手动 git clone） ----------
      - name: Install Flutter SDK
        run: |
          git clone https://github.com/flutter/flutter.git --depth 1 -b stable /opt/flutter
          echo "/opt/flutter/bin" >> $GITHUB_PATH

      - name: Pre-download Flutter toolchain
        run: flutter doctor -v

      # ---------- 安装 Linux 构建依赖 ----------
      - name: Install Linux build dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            mesa-utils libvulkan-dev desktop-file-utils wget \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libunwind-dev libsecret-1-dev

      # ---------- 关键修复：安装 ARM64 版 appimagetool ----------
      - name: Install AppImageTool (ARM64)
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/bin/appimagetool
          sudo apt-get install -y libfuse2

      # ---------- 构建 ----------
      - name: Get Dart dependencies
        run: flutter pub get

      - name: Build Linux ARM64
        run: dart run fl_build -p linux

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: serverbox-linux-arm64
          path: build/linux/arm64/release/bundle/
